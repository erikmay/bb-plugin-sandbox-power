name: Upstream watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Compare against bb main
        run: node scripts/check-upstream.mjs main --json --markdown report.md > report.json
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_AGENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$(jq -r '.drift or (.newReleases | length > 0)' report.json)" != true ]; then
            echo "No upstream drift."
            exit 0
          fi
          gh label create upstream-drift --color FBCA04 --description "bb changed something this plugin tracks" 2>/dev/null || true
          gh label create agent --color 5319E7 --description "Hand to the coding agent" 2>/dev/null || true
          title="Upstream drift: bb $(jq -r '.targetCommit[0:12]' report.json)"
          number=$(gh issue list --label upstream-drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file report.md
          else
            url=$(gh issue create --title "$title" --body-file report.md --label upstream-drift)
            number=${url##*/}
          fi
          echo "Drift issue: #$number"
          if [ "$HAS_AGENT" = true ] && [ "$(jq -r '.drift' report.json)" = true ]; then
            gh workflow run agent.yml -f issue="$number"
          fi
