name: Agent

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to work on
        required: true
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: agent-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_AGENT: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Skip without agent credentials
        if: env.HAS_AGENT != 'true'
        run: echo "::notice::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable the agent."
      - uses: actions/checkout@v5
        if: env.HAS_AGENT == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: env.HAS_AGENT == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_AGENT == 'true'
        run: npm ci --ignore-scripts
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_AGENT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You maintain this repository. Work on issue #${{ env.ISSUE }} of ${{ github.repository }}.
            Read it with `gh issue view ${{ env.ISSUE }} --comments`, then read AGENTS.md and follow it exactly:
            for upstream drift follow "Upgrading to a newer bb"; for features and bugs follow "Adding a feature".
            Definition of done (from AGENTS.md) must hold: `npm run typecheck` and `npm test`.
            Work on a branch named agent/issue-${{ env.ISSUE }}, commit with clear messages, push it, open a pull
            request with `gh pr create` that says "Closes #${{ env.ISSUE }}", describes what changed and how it was
            verified, then trigger CI on it with `gh workflow run ci.yml --ref agent/issue-${{ env.ISSUE }}`.
            If the issue is unclear or needs a human decision, comment on the issue with your questions instead.
            Never print secrets. Never push to main and never create tags; releases happen when a human merges.
          claude_args: >-
            --allowedTools "Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*),Read,Edit,Write,Glob,Grep"
